[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nullfox"
version = "0.7.0"
description = "Cross-platform universal file encryption toolkit utilizing optimized native AES-256 and SHA-256 engines."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
    { name = "NullFox", email = "pr0zone.gmaing.z@gmail.com" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Development Status :: 4 - Beta",
]

dependencies = [
    "cffi>=1.15.0",
]

[tool.setuptools]
packages = ["nullfox", "nullfox.src.Binaries", "nullfox.src.C", "nullfox.src.Python"]

[tool.setuptools.package-data]
"nullfox.src.Binaries" = ["*.so", "*.dll", "*.bat", "*.sh"]
"nullfox.src.C" = ["*.c", "*.h"]

[project.urls]
Homepage = "https://github.com/JojoModz/nullfox"
Documentation = "https://github.com/JojoModz/nullfox#readme"
Source = "https://github.com/JojoModz/nullfox"
Issues = "https://github.com/JojoModz/nullfox/issues"